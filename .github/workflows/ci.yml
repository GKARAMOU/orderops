name: Verify OrderOps
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt
      - run: pip install -r forecast/requirements.txt
      - run: python -m pytest tests -q
        working-directory: forecast
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 scripts/configure.py
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/actuator/health && exit 0; sleep 2; done; exit 1
      - run: python3 scripts/seed_demo.py
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8080
      - run: docker compose logs --no-color
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: frontend/test-results
      - run: docker compose down
        if: always()

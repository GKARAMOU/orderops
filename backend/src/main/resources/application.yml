server:
  port: ${PORT:8080}
spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orderops}
    username: ${DATABASE_USER:orderops}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
orderops:
  jwt-secret: ${JWT_SECRET}
  bootstrap-email: ${ADMIN_EMAIL:admin@orderops.local}
  bootstrap-password: ${ADMIN_PASSWORD}
  forecast-url: ${FORECAST_URL:http://localhost:8000}
